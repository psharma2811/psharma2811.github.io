<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Checkout</span>
</nav>

<div class="container mt-4">

    <div class="row">

        <div class="col-md-6">
            <h4>Customer Details</h4>

            <form id="checkoutForm">
                <input type="text" class="form-control mb-2" placeholder="First Name" required name="firstName">
                <input type="text" class="form-control mb-2" placeholder="Last Name" required name="lastName">
                <input type="email" class="form-control mb-2" placeholder="Email" required name="email">
                <input type="tel" class="form-control mb-2" placeholder="Phone" required name="phone">
                <input type="text" class="form-control mb-2" placeholder="Address" required name="address">
                <input type="text" class="form-control mb-2" placeholder="City" required name="city">
                <input type="text" class="form-control mb-2" placeholder="State" required name="state">
                <input type="text" class="form-control mb-2" placeholder="Country" required name="country">
                <input type="text" class="form-control mb-2" placeholder="Zip" required name="zip">

                <button class="btn btn-success mt-2">Place Order</button>
            </form>
        </div>

        <div class="col-md-6">
            <h4>Order Summary</h4>
            <div id="orderSummary"></div>
        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="assets/js/checkout.js"></script>

</body>
</html>
