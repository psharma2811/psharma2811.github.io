<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Shop</span>
    <a href="cart.html" class="btn btn-light">
        Cart <span id="cartCount" class="badge bg-danger">0</span>
    </a>
</nav>

<div class="container mt-4">

    <div>
        <h5>Category</h5>
        <button class="btn btn-outline-primary" onclick="selectCategory('all')">All</button>
        <button class="btn btn-outline-primary" onclick="selectCategory('watch')">Watch</button>
        <button class="btn btn-outline-primary" onclick="selectCategory('glasses')">Glasses</button>
        <button class="btn btn-outline-primary" onclick="selectCategory('shoes')">Shoes</button>
    </div>

    <div class="mt-3">
        <h5>Subcategory</h5>
        <button class="btn btn-outline-secondary" onclick="selectSubcategory('all')">All</button>
        <button class="btn btn-outline-secondary" onclick="selectSubcategory('men')">Men</button>
        <button class="btn btn-outline-secondary" onclick="selectSubcategory('women')">Women</button>
        <button class="btn btn-outline-secondary" onclick="selectSubcategory('kids')">Kids</button>
    </div>

    <div class="row mt-4" id="productGrid"></div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
